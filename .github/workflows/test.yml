name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile tests
        run: >
          g++ -std=c++17 -Wall -Wextra -Werror -DUNIT_TEST
          -I .
          tests/test_alarmclock.cpp
          -o run_tests

      - name: Run tests
        run: ./run_tests

  esphome-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config:
          - alarmclock.yaml
          - alarmclock-p4-5inch.yaml
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install esphome

      - name: Create dummy secrets
        run: |
          cat > secrets.yaml <<'EOF'
          wifi_ssid: "TestSSID"
          wifi_password: "TestPassword"
          wifi_fallback_password: "TestFallback123"
          encryption_key: "qQpfEIA1sPWVORMZ3QJKuRYAigxlOyParAwrqBm95Hg="
          ota_password: "testotapassword"
          EOF

      - name: Use checked-out component
        run: |
          grep -Fq "url: https://github.com/aclight/esphome-alarmclock.git" alarmclock.yaml
          sed -i '/^      type: git$/,/^      path: components$/c\      type: local\n      path: components' alarmclock.yaml

      - name: Compile ESPHome config
        run: esphome compile "${{ matrix.config }}"
