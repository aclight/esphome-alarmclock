name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # alarmclock.h includes the shared header by its ESPHome build path, so
      # lay the pinned checkout out as <inc>/esphome/components/...
      - name: Fetch adaptive_brightness at the pinned tag
        run: |
          ref=$(grep -oP 'esphome-shared-components@\K\S+' alarmclock.yaml)
          test -n "$ref"
          git clone --depth 1 --branch "$ref" \
            https://github.com/aclight/esphome-shared-components.git "$RUNNER_TEMP/shared"
          mkdir -p "$RUNNER_TEMP/inc/esphome"
          ln -s "$RUNNER_TEMP/shared/components" "$RUNNER_TEMP/inc/esphome/components"

      - name: Compile tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -DUNIT_TEST \
            -I . -I "$RUNNER_TEMP/inc" \
            tests/test_alarmclock.cpp \
            -o run_tests

      - name: Run tests
        run: ./run_tests

  esphome-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config:
          - alarmclock.yaml
          - alarmclock-p4-5inch.yaml
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install esphome==2026.9.1

      - name: Create dummy secrets
        run: |
          cat > secrets.yaml <<'EOF'
          wifi_ssid: "TestSSID"
          wifi_password: "TestPassword"
          wifi_fallback_password: "TestFallback123"
          encryption_key: "qQpfEIA1sPWVORMZ3QJKuRYAigxlOyParAwrqBm95Hg="
          EOF

      - name: Use checked-out alarm clock component
        run: |
          grep -Fq "url: https://github.com/aclight/esphome-alarmclock.git" alarmclock.yaml
          sed -i '/^      type: git$/,/^      path: components$/c\      type: local\n      path: components' alarmclock.yaml
          ! grep -Fq "type: git" alarmclock.yaml
          grep -Fq "url: https://github.com/aclight/esphome-mipi-rgb.git" alarmclock-p4-5inch.yaml
          grep -Fq "ref: esphome-2026.9.1-r1" alarmclock-p4-5inch.yaml

      - name: Add sample controls so the controls page is compiled
        run: |
          python - <<'EOF'
          import pathlib
          path = pathlib.Path("alarmclock.yaml")
          text = path.read_text()
          sample = """    controls:
                - type: toggle
                  name: Lamp
                  entity_id: light.lamp
                - type: dimmer
                  name: Bedside
                  entity_id: light.bedside
                - type: action
                  name: Goodnight
                  on_press:
                    - homeassistant.action:
                        action: automation.trigger
                        data:
                          entity_id: automation.goodnight
          """
          assert "    controls: []\n" in text
          path.write_text(text.replace("    controls: []\n", sample))
          EOF

      - name: Compile ESPHome config
        run: esphome compile "${{ matrix.config }}"

      # LVGL compiles color filters out by default, which silently disables
      # the night content shading.
      - name: Check LVGL color filter is enabled
        run: grep -Fq "#define LV_USE_COLOR_FILTER 1" .esphome/build/*/src/lv_conf.h

  # ESP-IDF asserts at runtime if the frame buffer is not an exact multiple of
  # the bounce buffer, so the component rejects it at config time instead.
  bounce-buffer-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install esphome==2026.9.1

      - name: Create dummy secrets
        run: |
          cat > secrets.yaml <<'EOF'
          wifi_ssid: "TestSSID"
          wifi_password: "TestPassword"
          wifi_fallback_password: "TestFallback123"
          encryption_key: "qQpfEIA1sPWVORMZ3QJKuRYAigxlOyParAwrqBm95Hg="
          EOF

      - name: Use checked-out alarm clock component
        run: |
          sed -i '/^      type: git$/,/^      path: components$/c\      type: local\n      path: components' alarmclock.yaml

      - name: Rejects a bounce_buffer_lines that does not divide the height
        run: |
          sed 's/^    bounce_buffer_lines: 40$/    bounce_buffer_lines: 9/' \
            alarmclock-p4-5inch.yaml > invalid.yaml
          grep -Fq "bounce_buffer_lines: 9" invalid.yaml
          if esphome config invalid.yaml > out.log 2>&1; then
            echo "::error::expected config validation to fail"
            cat out.log
            exit 1
          fi
          grep -Fq "must divide the display height" out.log

      - name: Accepts the production value
        run: esphome config alarmclock-p4-5inch.yaml > /dev/null

      - name: Accepts unquoted off in the HVAC mode list
        run: |
          sed 's/^    vertical_vane_entity_id: .*$/&\n    hvac_modes: [off, cool]/' \
            alarmclock.yaml > modes.yaml
          grep -Fq "hvac_modes: [off, cool]" modes.yaml
          esphome config modes.yaml > /dev/null

      - name: Rejects more than six controls
        run: |
          python - <<'EOF'
          import pathlib
          text = pathlib.Path("alarmclock.yaml").read_text()
          items = "".join(
              f"      - type: toggle\n        name: L{i}\n        entity_id: light.l{i}\n"
              for i in range(7)
          )
          assert "    controls: []\n" in text
          pathlib.Path("too_many.yaml").write_text(
              text.replace("    controls: []\n", "    controls:\n" + items)
          )
          EOF
          if esphome config too_many.yaml > out.log 2>&1; then
            echo "::error::expected config validation to fail"
            exit 1
          fi
