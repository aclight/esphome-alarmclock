              - image: {id: grid_widget_06, src: grid_img_06, width: 118, height: 118}
              - image: {id: grid_widget_07, src: grid_img_07, width: 118, height: 118}
              - image: {id: grid_widget_08, src: grid_img_08, width: 118, height: 118}
              - image: {id: grid_widget_09, src: grid_img_09, width: 118, height: 118}
