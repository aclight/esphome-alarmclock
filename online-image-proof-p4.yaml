wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "AlarmClock Online Image Proof Fallback"
    password: !secret wifi_fallback_password

mdns:
  disabled: true

captive_portal:

api:
  encryption:
    key: !secret encryption_key
  # No HA client ever connects to this proof device, so the default 15min
  # reboot_timeout would otherwise reboot it on a cycle during log captures.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: DEBUG
  hardware_uart: UART0

dashboard_import:
  package_import_url: github://aclight/esphome-alarmclock/online-image-proof-p4.yaml@online-image-proof-p4
  import_full_config: true
