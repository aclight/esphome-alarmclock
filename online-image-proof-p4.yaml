substitutions:
  name: "alarmclock-p4"
  image_base_url: "http://192.168.1.142:8000"
  # Deliberately unreachable LAN address (nothing listens here) so
  # http_request has to hit its own client-side timeout rather than getting
  # an instant connection-refused. Pick a different free address if this one
  # is ever claimed on your LAN.
  timeout_test_url: "http://192.168.1.250:8000/p00.png"

esphome:
  name: ${name}
  friendly_name: "Alarm Clock P4 Online Image Proof"
  project:
    name: aclight.alarmclock-online-image-proof
    version: "1.0.0"
  includes:
    - esp_heap_caps.h
  # Turn on the STC8 backlight (0x1B enables the panel, 0x20 sets brightness)
  # once i2c_bus is up. Copied from sd-card-proof-p4 — same board, same chip.
  on_boot:
    - priority: -100.0
      then:
        - lambda: |-
            const uint8_t power[] = {0x1B, 1};
            const uint8_t brightness[] = {0x20, 100};
            id(i2c_bus).write(0x2F, power, sizeof(power));
            id(i2c_bus).write(0x2F, brightness, sizeof(brightness));

preferences:
  flash_write_interval: 1h

esp32:
  variant: esp32p4
  engineering_sample: true
  flash_size: 16MB
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    advanced:
      execute_from_psram: true
      enable_idf_experimental_features: true
    sdkconfig_options:
      # Workaround for espressif/esp-idf#19020 (P4 SPM 8KB pool bootloop assert).
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "8192"
      # A big JPEG/PNG decode is fully synchronous within one loopTask
      # iteration and doesn't feed the watchdog mid-decode; raise the
      # default 5s task WDT so the 18-slot grid refresh can't trip it.
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "15"

psram:
  mode: hex
  speed: 200MHz

esp32_hosted:
  type: sdio
  variant: ESP32C6
  reset_pin: GPIO20
  active_high: true
  clk_pin: GPIO53
  cmd_pin: GPIO54
  d0_pin: GPIO52
  d1_pin: GPIO51
  d2_pin: GPIO50
  d3_pin: GPIO49
  bus_width: 4
  slot: 1
  sdio_frequency: 40MHz

# Vendored mipi_rgb (already merged to main) — provides bounce_buffer_lines
# and force_restart, both required on this board to avoid tearing/glitches.
external_components:
  - source:
      type: git
      url: https://github.com/aclight/esphome-alarmclock.git
      ref: main
      path: components
    components: [mipi_rgb]
    refresh: 0s

i2c:
  id: i2c_bus
  sda: GPIO45
  scl: GPIO46

# Display timings copied verbatim from the known-good alarmclock-p4-5inch.yaml.
display:
  - platform: mipi_rgb
    model: RPI
    id: main_display
    auto_clear_enabled: false
    update_interval: never
    color_order: RGB
    pclk_frequency: 18MHz
    bounce_buffer_lines: 40
    force_restart: false
    dimensions:
      width: 800
      height: 480
    de_pin: GPIO2
    vsync_pin: GPIO41
    hsync_pin: GPIO40
    pclk_pin: GPIO3
    data_pins:
      red:
        - GPIO19
        - GPIO18
        - GPIO17
        - GPIO16
        - GPIO15
      green:
        - GPIO14
        - GPIO13
        - GPIO12
        - GPIO11
        - GPIO10
        - GPIO9
      blue:
        - GPIO8
        - GPIO7
        - GPIO6
        - GPIO5
        - GPIO4
    hsync_front_porch: "8"
    hsync_pulse_width: "8"
    hsync_back_porch: "4"
    vsync_front_porch: "8"
    vsync_pulse_width: "8"
    vsync_back_porch: "4"

touchscreen:
  - platform: gt911
    id: touch
    display: main_display
    update_interval: 16ms
    reset_pin:
      number: GPIO36
      ignore_strapping_warning: true
    interrupt_pin: GPIO42

http_request:
  id: http_req
  timeout: 8s
  watchdog_timeout: 15s

# --- Timing/bookkeeping state, all read/written from the test buttons below ---
globals:
  - id: preview_test_name
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: preview_start_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: cycle_index
    type: int
    restore_value: false
    initial_value: "0"
  - id: timing_png_start_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: timing_jpeg_start_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: grid_pending
    type: int
    restore_value: false
    initial_value: "0"
  - id: grid_test_start_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: soak_running
    type: bool
    restore_value: false
    initial_value: "false"
  - id: soak_slot
    type: int
    restore_value: false
    initial_value: "0"

image:
  # --- Test 1 / 4 / 6: a single reusable slot for the manual one-off tests
  # (fetch-once, runtime set_url cycling, 404, timeout, mid-download drop).
  # They share one online_image + widget so all of them exercise the same
  # "set_url + update, repaint on_download_finished" path.
  - platform: online_image
    id: preview_img
    url: "${image_base_url}/real/r00.png"
    format: PNG
    type: RGB565
    resize: 96x96
    update_interval: never
    on_download_finished:
      - lambda: |-
          uint32_t elapsed = millis() - id(preview_start_ms);
          ESP_LOGI("proof", "%s finished in %ums (cached=%d), free PSRAM=%u B",
                   id(preview_test_name).c_str(), elapsed, cached,
                   (unsigned) heap_caps_get_free_size(MALLOC_CAP_SPIRAM));
      - lvgl.widget.redraw: preview_widget
    on_error:
      - lambda: |-
          uint32_t elapsed = millis() - id(preview_start_ms);
          ESP_LOGW("proof", "%s FAILED after %ums", id(preview_test_name).c_str(), elapsed);

  # --- Test 3: PNG vs JPEG decode time + PSRAM cost, same source image.
  - platform: online_image
    id: timing_png
    url: "${image_base_url}/real/r00.png"
    format: PNG
    type: RGB565
    resize: 124x190
    update_interval: never
    on_download_finished:
      - lambda: |-
          uint32_t elapsed = millis() - id(timing_png_start_ms);
          ESP_LOGI("proof", "TEST3 PNG decode: %ums (cached=%d), free PSRAM=%u B",
                   elapsed, cached, (unsigned) heap_caps_get_free_size(MALLOC_CAP_SPIRAM));
    on_error:
      - lambda: 'ESP_LOGW("proof", "TEST3 PNG fetch failed");'
  - platform: online_image
    id: timing_jpeg
    url: "${image_base_url}/real/r00.jpg"
    format: JPEG
    type: RGB565
    resize: 124x190
    update_interval: never
    on_download_finished:
      - lambda: |-
          uint32_t elapsed = millis() - id(timing_jpeg_start_ms);
          ESP_LOGI("proof", "TEST3 JPEG decode: %ums (cached=%d), free PSRAM=%u B",
                   elapsed, cached, (unsigned) heap_caps_get_free_size(MALLOC_CAP_SPIRAM));
    on_error:
      - lambda: 'ESP_LOGW("proof", "TEST3 JPEG fetch failed");'

  # --- Test 2: soak — continuously re-fetches+decodes real thumbnails while
  # soak_running is true, to see whether sustained HTTP+decode load
  # destabilizes the RGB panel (the tearing fixes were only ever soaked
  # against a static clock face, never this kind of traffic).
  - platform: online_image
    id: soak_img
    url: "${image_base_url}/real/r00.png"
    format: PNG
    type: RGB565
    resize: 64x64
    update_interval: never
    on_download_finished:
      - lambda: |-
          uint32_t elapsed = millis() - id(preview_start_ms);
          ESP_LOGI("proof", "TEST2 soak slot %d: %ums (cached=%d), free PSRAM=%u B",
                   id(soak_slot), elapsed, cached,
                   (unsigned) heap_caps_get_free_size(MALLOC_CAP_SPIRAM));
      - lvgl.widget.redraw: soak_widget
    on_error:
      - lambda: |-
          ESP_LOGW("proof", "TEST2 soak slot %d FAILED", id(soak_slot));

  # --- Test 5: 18 simultaneous instances, wall-clock time for a full
  # page refresh. Only 10 distinct real/ thumbnails exist, so slots repeat
  # after r09 — that's fine, this test is about plumbing/timing, not content.
  - platform: online_image
    id: grid_img_00
    url: "${image_base_url}/real/r00.png"
    format: PNG
    type: RGB565
    resize: 118x118
    update_interval: never
    on_download_finished:
      - lambda: |-
          ESP_LOGI("proof", "grid[00] loaded (cached=%d), free PSRAM=%u B", cached,
                   (unsigned) heap_caps_get_free_size(MALLOC_CAP_SPIRAM));
          id(grid_pending) = id(grid_pending) > 0 ? id(grid_pending) - 1 : 0;
          if (id(grid_pending) == 0) {
            ESP_LOGI("proof", "TEST5: full grid refresh took %ums",
                     (unsigned) (millis() - id(grid_test_start_ms)));
          }
      - lvgl.widget.redraw: grid_widget_00
    on_error:
      - lambda: |-
          ESP_LOGW("proof", "grid[00] FAILED");
          id(grid_pending) = id(grid_pending) > 0 ? id(grid_pending) - 1 : 0;
  - platform: online_image
    id: grid_img_01
    url: "${image_base_url}/real/r01.png"
    format: PNG
    type: RGB565
    resize: 118x118
    update_interval: never
