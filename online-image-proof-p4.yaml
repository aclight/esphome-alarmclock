  - platform: online_image
    id: grid_img_17
    url: "${image_base_url}/real/r07.png"
    format: PNG
    type: RGB565
    resize: 118x118
    update_interval: never
    on_download_finished:
      - lambda: |-
          ESP_LOGI("proof", "grid[17] loaded (cached=%d), free PSRAM=%u B", cached,
                   (unsigned) heap_caps_get_free_size(MALLOC_CAP_SPIRAM));
          id(grid_pending) = id(grid_pending) > 0 ? id(grid_pending) - 1 : 0;
          if (id(grid_pending) == 0) {
            ESP_LOGI("proof", "TEST5: full grid refresh took %ums",
                     (unsigned) (millis() - id(grid_test_start_ms)));
          }
      - lvgl.widget.redraw: grid_widget_17
    on_error:
      - lambda: |-
          ESP_LOGW("proof", "grid[17] FAILED");
          id(grid_pending) = id(grid_pending) > 0 ? id(grid_pending) - 1 : 0;

# --- Periodic free-memory log, independent of any test, so PSRAM headroom
# over time is recoverable from serial output even if no test is running.
interval:
  - interval: 30s
    then:
      - lambda: |-
          ESP_LOGI("proof", "heartbeat: free PSRAM=%u B, free internal=%u B",
                   (unsigned) heap_caps_get_free_size(MALLOC_CAP_SPIRAM),
                   (unsigned) heap_caps_get_free_size(MALLOC_CAP_INTERNAL));
  # Test 2 driver: while soak_running, re-fetch+decode a rotating real
  # thumbnail into the single soak_img slot every 2s.
  - interval: 2s
    then:
      - if:
          condition:
            lambda: "return id(soak_running);"
          then:
            - lambda: |-
                id(soak_slot) = (id(soak_slot) + 1) % 10;
                id(preview_start_ms) = millis();
            - online_image.set_url:
                id: soak_img
                url: !lambda |-
                  static const char *urls[10] = {
                    "${image_base_url}/real/r00.png", "${image_base_url}/real/r01.png",
                    "${image_base_url}/real/r02.png", "${image_base_url}/real/r03.png",
                    "${image_base_url}/real/r04.png", "${image_base_url}/real/r05.png",
                    "${image_base_url}/real/r06.png", "${image_base_url}/real/r07.png",
                    "${image_base_url}/real/r08.png", "${image_base_url}/real/r09.png",
                  };
                  return std::string(urls[id(soak_slot)]);

lvgl:
  displays:
    - main_display
  touchscreens:
    - touch
  buffer_size: 12%
  pages:
    - id: proof_page
      widgets:
        - obj:
            id: control_bar
            x: 0
            y: 0
            width: 800
            height: 116
            pad_all: 4
            layout:
              type: flex
              flex_flow: ROW_WRAP
            widgets:
              # Test 1: proves http_request works at all over ESP-Hosted SDIO.
              - button:
                  id: btn_fetch_once
                  text: "Fetch1"
                  width: 90
                  height: 52
                  on_click:
                    - lambda: |-
                        id(preview_test_name) = "TEST1 fetch_once";
                        id(preview_start_ms) = millis();
                        ESP_LOGI("proof", "TEST1: fetch_once pressed");
                    - online_image.set_url:
                        id: preview_img
                        url: "${image_base_url}/real/r00.png"
              # Test 2: soak toggle.
              - switch:
                  id: soak_switch
                  width: 60
                  height: 52
                  on_value:
                    - lambda: |-
                        id(soak_running) = x;
                        ESP_LOGI("proof", "TEST2 soak %s", x ? "STARTED" : "stopped");
              # Test 3: PNG vs JPEG decode time + PSRAM cost, same source image.
              - button:
                  id: btn_png_vs_jpeg
                  text: "PNG/JPG"
                  width: 90
                  height: 52
                  on_click:
                    - lambda: |-
                        id(timing_png_start_ms) = millis();
                        id(timing_jpeg_start_ms) = millis();
                        ESP_LOGI("proof", "TEST3: PNG vs JPEG timing start");
                    - component.update: timing_png
                    - component.update: timing_jpeg
              # Test 4: runtime set_url + update, repaint on_download_finished.
              - button:
                  id: btn_cycle
                  text: "Cycle"
                  width: 90
                  height: 52
                  on_click:
                    - lambda: |-
                        id(cycle_index) = (id(cycle_index) + 1) % 4;
                        id(preview_test_name) = "TEST4 cycle";
                        id(preview_start_ms) = millis();
                    - online_image.set_url:
                        id: preview_img
                        url: !lambda |-
                          static const char *urls[4] = {
                            "${image_base_url}/p00.png",
                            "${image_base_url}/p00.jpg",
                            "${image_base_url}/s00.png",
                            "${image_base_url}/s00.jpg",
                          };
                          return std::string(urls[id(cycle_index)]);
              # Test 5: 18 simultaneous instances, wall-clock full-grid refresh.
              - button:
                  id: btn_fill_grid
                  text: "Fill18"
                  width: 90
                  height: 52
                  on_click:
                    - lambda: |-
                        id(grid_pending) = 18;
                        id(grid_test_start_ms) = millis();
                        ESP_LOGI("proof", "TEST5: filling all 18 grid slots simultaneously");
                    - component.update: grid_img_00
                    - component.update: grid_img_01
                    - component.update: grid_img_02
                    - component.update: grid_img_03
                    - component.update: grid_img_04
                    - component.update: grid_img_05
                    - component.update: grid_img_06
                    - component.update: grid_img_07
                    - component.update: grid_img_08
                    - component.update: grid_img_09
                    - component.update: grid_img_10
                    - component.update: grid_img_11
                    - component.update: grid_img_12
                    - component.update: grid_img_13
                    - component.update: grid_img_14
                    - component.update: grid_img_15
                    - component.update: grid_img_16
                    - component.update: grid_img_17
              # Test 6a: 404.
              - button:
                  id: btn_404
                  text: "404"
                  width: 70
                  height: 52
                  on_click:
                    - lambda: |-
                        id(preview_test_name) = "TEST6 404";
                        id(preview_start_ms) = millis();
                    - online_image.set_url:
                        id: preview_img
                        url: "${image_base_url}/real/does-not-exist.png"
              # Test 6b: timeout (unreachable host).
              - button:
                  id: btn_timeout
                  text: "T/O"
                  width: 70
                  height: 52
                  on_click:
                    - lambda: |-
                        id(preview_test_name) = "TEST6 timeout";
                        id(preview_start_ms) = millis();
                    - online_image.set_url:
                        id: preview_img
                        url: "${timeout_test_url}"
              # Test 6c: mid-download Wi-Fi drop — manual. Fetches a real
              # image; disable the AP or walk the panel out of range while
              # this is in flight to see the failure behavior.
              - button:
                  id: btn_drop
                  text: "Drop"
                  width: 70
                  height: 52
                  on_click:
                    - lambda: |-
                        id(preview_test_name) = "TEST6 mid-download drop (manual)";
                        id(preview_start_ms) = millis();
                        ESP_LOGW("proof", "TEST6 drop: fetching now - disable Wi-Fi mid-download to observe failure behavior");
                    - online_image.set_url:
                        id: preview_img
                        url: "${image_base_url}/real/r09.png"
              - image:
                  id: preview_widget
                  src: preview_img
                  width: 56
                  height: 56
              - image:
                  id: soak_widget
                  src: soak_img
                  width: 56
                  height: 56
        - obj:
            id: grid_container
            x: 0
            y: 116
            width: 800
            height: 364
            pad_all: 2
            layout:
              type: flex
              flex_flow: ROW_WRAP
            widgets:
              - image: {id: grid_widget_00, src: grid_img_00, width: 118, height: 118}
