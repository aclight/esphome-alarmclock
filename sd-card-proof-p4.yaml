esphome:
  name: alarmclock-p4
  friendly_name: Alarm Clock P4 SD Wallpaper Proof
  project:
    name: aclight.alarmclock-sd-wallpaper-proof
    version: "1.0.0"
  # Turn on the STC8 backlight (0x1B enables the panel, 0x20 sets brightness)
  # once i2c_bus is up.
  on_boot:
    - priority: -100.0
      then:
        - lambda: |-
            const uint8_t power[] = {0x1B, 1};
            const uint8_t brightness[] = {0x20, 100};
            id(i2c_bus).write(0x2F, power, sizeof(power));
            id(i2c_bus).write(0x2F, brightness, sizeof(brightness));

# Experiment: flash writes (default every 60s) briefly disable CPU cache and
# interrupts on both cores system-wide - a well-known cause of RGB panel
# glitches/watchdog panics, independent of any Wi-Fi/SDIO bus contention.
# Stretched way out to isolate that from the wifi theory, wifi kept enabled.
preferences:
  flash_write_interval: 1h

esp32:
  variant: esp32p4
  engineering_sample: true
  flash_size: 16MB
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true
    sdkconfig_options:
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "8192"
      # ESP-IDF's FATFS disables long filenames by default (8.3 short names
      # only), which can't resolve "wallpaper.jpg" (9-char base name).
      CONFIG_FATFS_LFN_HEAP: "y"
      # The one-time JPEG decode+draw blocks the main loop long enough to
      # trip the default 5s task watchdog on larger-than-800x480 images.
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "15"
      # Tried CONFIG_LCD_RGB_ISR_IRAM_SAFE / CONFIG_LCD_RGB_RESTART_IN_VSYNC
      # (both off by default). No proven benefit yet, but note that
      # RESTART_IN_VSYNC is NOT dead code on the P4: only the separate restart
      # DMA link is S3-only, and lcd_rgb_panel_try_restart_transmission() has a
      # working non-S3 branch that runs from the VSYNC_END ISR.
      #
      # Each RGB bounce-buffer refill ends in a Cache_Start_L2_Cache_Preload()
      # of the whole buffer, which at the default 128KB L2 evicts most of the
      # cache every few hundred microseconds. 256KB is the experiment; it
      # costs 128KB of the 768KB L2MEM.
      CONFIG_CACHE_L2_CACHE_256KB: "y"

psram:
  mode: hex
  speed: 200MHz

esp32_hosted:
  type: sdio
  variant: ESP32C6
  reset_pin: GPIO20
  active_high: true
  clk_pin: GPIO53
  cmd_pin: GPIO54
  d0_pin: GPIO52
  d1_pin: GPIO51
  d2_pin: GPIO50
  d3_pin: GPIO49
  bus_width: 4
  slot: 1
  # Neither 20MHz nor 50MHz (vs. the 40MHz default) made a clear difference,
  # so frequency isn't the controlling variable here. Back to default to
  # isolate the mdns: disabled experiment below on its own.
  sdio_frequency: 40MHz

external_components:
  - source:
      type: git
      url: https://github.com/aclight/esphome-alarmclock.git
      ref: sd-card-proof-p4
      path: components
    # mipi_rgb here is a vendored copy of the stock ESPHome component that
    # overrides the built-in one, adding the bounce_buffer_lines option below.
    components: [sd_card_proof, mipi_rgb]
    refresh: 0s

i2c:
  id: i2c_bus
  sda: GPIO45
  scl: GPIO46

# Display timings copied from the known-good alarmclock-p4-5inch.yaml config.
display:
  - platform: mipi_rgb
    model: RPI
    id: main_display
    auto_clear_enabled: false
    update_interval: never
    color_order: RGB
    pclk_frequency: 18MHz
    # Stock hardcodes 10 scanlines (~456us of scanout at 18MHz) and tears. This
    # and force_restart fix two independent defects: 10 lines tears with the
    # restart either on or off, and 40 lines still glitches with it on, so both
    # are necessary and neither is sufficient. Raising past 40 is pointless -
    # measured end-of-frame slack never drops below ~2.4ms, so the DMA is never
    # close to starving. Costs 2 x 800 x 40 x 2 = 128KB of internal SRAM.
    # Must divide the height.
    bounce_buffer_lines: 40
    # Upstream resets the FIFO and GDMA on every VSYNC. The ISR has only the
    # 4-line vertical back porch (~182us) to do that before the panel starts
    # clocking out pixels, and all 315 late frames measured over 31min missed
    # it (min 203us, mean 530us) - so each one re-sent bytes already on the
    # wire, which is the shift-and-wrap glitch. IDF still restarts on a real
    # underrun via its own bb_eof_count check, so recovery is retained.
    force_restart: false
    # Instrumentation off for now: with it on, 12.6% of timestamps came back
    # corrupt and the device took two interrupt-WDT panics in 7.5min. 0s means
    # no callbacks are registered at all, which isolates force_restart from the
    # measurement code as the cause. Set back to 60s once that is settled.
    desync_report_interval: 0s
    dimensions:
      width: 800
      height: 480
    de_pin: GPIO2
    vsync_pin: GPIO41
    hsync_pin: GPIO40
    pclk_pin: GPIO3
    data_pins:
      red:
        - GPIO19
        - GPIO18
        - GPIO17
        - GPIO16
        - GPIO15
      green:
        - GPIO14
        - GPIO13
        - GPIO12
        - GPIO11
        - GPIO10
        - GPIO9
      blue:
        - GPIO8
        - GPIO7
        - GPIO6
        - GPIO5
        - GPIO4
    hsync_front_porch: "8"
    hsync_pulse_width: "8"
    # +1 (to 5) made no difference to the left-edge wrap line's position or
    # width, so DE/HSYNC alignment isn't the mechanism (or isn't sensitive at
    # this granularity). Reverted to the known-good value.
    hsync_back_porch: "4"
    vsync_front_porch: "8"
    vsync_pulse_width: "8"
    vsync_back_porch: "4"

# Minimal LVGL page; sd_card_proof replaces its contents with the wallpaper
# image once the SD card is mounted.
# Reverted to 12% (matches the production alarmclock-p4-5inch.yaml, which
# shows zero tearing) after 100% - one large uninterrupted PSRAM copy instead
# of several smaller ones - didn't help and may have made things worse.
lvgl:
  displays:
    - main_display
  buffer_size: 12%
  pages:
    - id: wallpaper_page
      widgets: []

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "AlarmClock SD Proof Fallback"
    password: !secret wifi_fallback_password
  # Experiment: default on esp32 is "light" (periodic modem sleep/wake).
  # That cycling could itself be the bursty SDIO activity contending with
  # the display; "none" keeps the radio link in one steady state instead.
  power_save_mode: none

# Experiment: mDNS is auto-loaded by the network component and joins the
# 224.0.0.251 multicast group, so this device processes every mDNS message
# from every other device on the subnet, not just its own - extra background
# SDIO traffic to rule out as a tearing contributor.
mdns:
  disabled: true

captive_portal:

api:
  encryption:
    key: !secret encryption_key
  # No HA client connects to this proof device, so the default 15min
  # reboot_timeout was rebooting it on a 15min cycle during log captures.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: DEBUG
  hardware_uart: UART0

dashboard_import:
  package_import_url: github://aclight/esphome-alarmclock/sd-card-proof-p4.yaml@sd-card-proof-p4
  import_full_config: true

# The card must be formatted FAT32 and contain /wallpaper.jpg, an 800x480
# baseline RGB JPEG, in its root directory.
sd_card_proof:
  clk_pin: 43
  cmd_pin: 44
  data0_pin: 39
  # Re-enabled to test the real symptom against the RESTART_IN_VSYNC fix;
  # the black-screen test wasn't conclusive (a corrupted line over solid
  # black may just look black, so it couldn't reliably show tearing either
  # way).
  show_wallpaper: true
