esphome:
  name: alarmclock-p4
  friendly_name: Alarm Clock P4 SD Wallpaper Proof
  project:
    name: aclight.alarmclock-sd-wallpaper-proof
    version: "1.0.0"
  # Turn on the STC8 backlight (0x1B enables the panel, 0x20 sets brightness)
  # once i2c_bus is up.
  on_boot:
    - priority: -100.0
      then:
        - lambda: |-
            const uint8_t power[] = {0x1B, 1};
            const uint8_t brightness[] = {0x20, 100};
            id(i2c_bus).write(0x2F, power, sizeof(power));
            id(i2c_bus).write(0x2F, brightness, sizeof(brightness));

esp32:
  variant: esp32p4
  engineering_sample: true
  flash_size: 16MB
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true
    sdkconfig_options:
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "8192"

psram:
  mode: hex
  speed: 200MHz

esp32_hosted:
  type: sdio
  variant: ESP32C6
  reset_pin: GPIO20
  active_high: true
  clk_pin: GPIO53
  cmd_pin: GPIO54
  d0_pin: GPIO52
  d1_pin: GPIO51
  d2_pin: GPIO50
  d3_pin: GPIO49
  bus_width: 4
  slot: 1
  sdio_frequency: 40MHz

external_components:
  - source:
      type: git
      url: https://github.com/aclight/esphome-alarmclock.git
      ref: sd-card-proof-p4
      path: components
    components: [sd_card_proof]
    refresh: 0s

i2c:
  id: i2c_bus
  sda: GPIO45
  scl: GPIO46

# Display timings copied from the known-good alarmclock-p4-5inch.yaml config.
display:
  - platform: mipi_rgb
    model: RPI
    id: main_display
    auto_clear_enabled: false
    update_interval: never
    color_order: RGB
    pclk_frequency: 18MHz
    dimensions:
      width: 800
      height: 480
    de_pin: GPIO2
    vsync_pin: GPIO41
    hsync_pin: GPIO40
    pclk_pin: GPIO3
    data_pins:
      red:
        - GPIO19
        - GPIO18
        - GPIO17
        - GPIO16
        - GPIO15
      green:
        - GPIO14
        - GPIO13
        - GPIO12
        - GPIO11
        - GPIO10
        - GPIO9
      blue:
        - GPIO8
        - GPIO7
        - GPIO6
        - GPIO5
        - GPIO4
    hsync_front_porch: "8"
    hsync_pulse_width: "8"
    hsync_back_porch: "4"
    vsync_front_porch: "8"
    vsync_pulse_width: "8"
    vsync_back_porch: "4"

# Minimal LVGL page; sd_card_proof replaces its contents with the wallpaper
# image once the SD card is mounted.
lvgl:
  displays:
    - main_display
  buffer_size: 12%
  pages:
    - id: wallpaper_page
      widgets: []

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "AlarmClock SD Proof Fallback"
    password: !secret wifi_fallback_password

captive_portal:

api:
  encryption:
    key: !secret encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: DEBUG
  hardware_uart: UART0

dashboard_import:
  package_import_url: github://aclight/esphome-alarmclock/sd-card-proof-p4.yaml@sd-card-proof-p4
  import_full_config: true

# The card must be formatted FAT32 and contain /wallpaper.jpg, an 800x480
# baseline RGB JPEG, in its root directory.
sd_card_proof:
  clk_pin: 43
  cmd_pin: 44
  data0_pin: 39
