substitutions:
  name: "alarmclock"
  friendly_name: "Alarm Clock"
  device_variant: esp32s3
  flash_size: 16MB
  psram_mode: octal
  psram_speed: 120MHz
  i2c_sda_pin: GPIO15
  i2c_scl_pin: GPIO16
  display_de_pin: GPIO42
  display_vsync_pin: GPIO41
  display_hsync_pin: GPIO40
  display_pclk_pin: GPIO39
  # Refresh = pclk / ((800+8+4+43) * (480+8+4+12)) = pclk / 430920.
  # 14MHz gave only 32.5Hz, which tears; 18MHz gives ~42Hz, matching the rate
  # that eliminated identical tearing on the P4 board.
  display_pclk_frequency: 18MHz
  display_hsync_front_porch: "8"
  display_hsync_pulse_width: "4"
  display_hsync_back_porch: "43"
  display_vsync_front_porch: "8"
  display_vsync_pulse_width: "4"
  display_vsync_back_porch: "12"
  display_r0_pin: GPIO7
  display_r1_pin: GPIO17
  display_r2_pin: GPIO18
  display_r3_pin: GPIO3
  display_r4_pin: GPIO46
  display_g0_pin: GPIO9
  display_g1_pin: GPIO10
  display_g2_pin: GPIO11
  display_g3_pin: GPIO12
  display_g4_pin: GPIO13
  display_g5_pin: GPIO14
  display_b0_pin: GPIO21
  display_b1_pin: GPIO47
  display_b2_pin: GPIO48
  display_b3_pin: GPIO45
  display_b4_pin: GPIO38
  i2s_lrclk_pin: GPIO6
  i2s_bclk_pin: GPIO5
  i2s_dout_pin: GPIO4
  controller_address: "0x30"
  backlight_mode: legacy_raw
  raw_backlight_pwm_max: "244"
  speaker_amp_mode: legacy_command

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: aclight.alarmclock
    version: "1.0.0"

esp32:
  variant: ${device_variant}
  flash_size: ${flash_size}
  # 240MHz is a prerequisite for 120MHz PSRAM, which the RGB panel DMA needs to
  # stream the framebuffer without underrunning its bounce buffer.
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced:
      # Required by ESPHome to allow 120MHz PSRAM in octal mode.
      enable_idf_experimental_features: true

psram:
  mode: ${psram_mode}
  speed: ${psram_speed}

external_components:
  - source:
      type: git
      url: https://github.com/aclight/esphome-alarmclock.git
      ref: main
      path: components
    components: [alarmclock]
    refresh: 0s

dashboard_import:
  package_import_url: github://aclight/esphome-alarmclock/alarmclock.yaml@main
  import_full_config: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "AlarmClock Fallback"
    password: !secret wifi_fallback_password

captive_portal:

api:
  encryption:
    key: !secret encryption_key
  homeassistant_services: true

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: INFO
  hardware_uart: UART0
  logs:
    i2c.idf: WARN
    lvgl: WARN
    touchscreen: WARN
    gt911.touchscreen: WARN
    number: WARN
    text_sensor: ERROR
    binary_sensor: ERROR
    sensor: WARN

# --- Volume/brightness now managed by the C++ component ---
# (globals removed — state lives in AlarmClockComponent)

# --- I2C bus (shared: touch controller + BH1750) ---
i2c:
  id: i2c_bus
  sda: ${i2c_sda_pin}
  scl: ${i2c_scl_pin}
  scan: true

# --- Time source from Home Assistant (with SNTP fallback) ---
# Timezone is auto-detected from the build machine. Override here if needed,
# e.g. timezone: America/Los_Angeles
time:
  - platform: homeassistant
    id: ha_time
  - platform: sntp
    id: sntp_time

# --- Display: mipi_rgb 800x480 ---
display:
  - platform: mipi_rgb
    model: RPI
    id: main_display
    auto_clear_enabled: false
    update_interval: never
    color_order: RGB
    pclk_frequency: ${display_pclk_frequency}
    dimensions:
      width: 800
      height: 480
    de_pin: ${display_de_pin}
    vsync_pin: ${display_vsync_pin}
    hsync_pin: ${display_hsync_pin}
    pclk_pin: ${display_pclk_pin}
    # Pin mapping verified against Elecrow CrowPanel Advance 4.3" official repo:
    # https://github.com/Elecrow-RD/CrowPanel-Advance-4.3-HMI-ESP32-S3-AI-Powered-IPS-Touch-Screen-800x480
    data_pins:
      red:
        - ${display_r0_pin}
        - ${display_r1_pin}
        - ${display_r2_pin}
        - ${display_r3_pin}
        - ${display_r4_pin}
      green:
        - ${display_g0_pin}
        - ${display_g1_pin}
        - ${display_g2_pin}
        - ${display_g3_pin}
        - ${display_g4_pin}
        - ${display_g5_pin}
      blue:
        - ${display_b0_pin}
        - ${display_b1_pin}
        - ${display_b2_pin}
        - ${display_b3_pin}
        - ${display_b4_pin}
    hsync_front_porch: ${display_hsync_front_porch}
    hsync_pulse_width: ${display_hsync_pulse_width}
    hsync_back_porch: ${display_hsync_back_porch}
    vsync_front_porch: ${display_vsync_front_porch}
    vsync_pulse_width: ${display_vsync_pulse_width}
    vsync_back_porch: ${display_vsync_back_porch}

# --- Touchscreen: GT911 ---
touchscreen:
  - platform: gt911
    id: touch
    display: main_display
    # ESPHome defaults to 50 ms polling when no interrupt pin is configured.
    # Sample near LVGL's 60 Hz refresh cadence for smoother drag tracking.
    update_interval: 16ms

# --- LVGL UI (minimal — all UI built in C++ component) ---
# The boot_page exists solely to force ESPHome to compile in the LVGL fonts
# and widgets used by our C++ UI code.  The C++ ui_init() replaces this page.
lvgl:
  displays:
    - main_display
  touchscreens:
    - touch
  buffer_size: 12%
  pages:
    - id: boot_page
      widgets:
        - label:
            text_font: montserrat_48
            text: ""
        - label:
            text_font: montserrat_40
            text: ""
        - label:
            text_font: montserrat_32
            text: ""
        - label:
            text_font: montserrat_28
            text: ""
        - label:
            text_font: montserrat_24
            text: ""
        - label:
            text_font: montserrat_20
            text: ""
        - label:
            text_font: montserrat_18
            text: ""
        - label:
            text_font: montserrat_16
            text: ""
        - label:
            text_font: montserrat_14
            text: ""
        - switch:
            hidden: true
        - button:
            hidden: true
        - slider:
            hidden: true
        - roller:
            hidden: true
            options: "1"
        - dropdown:
            hidden: true
            options: "1"
        - textarea:
            hidden: true
        - keyboard:
            hidden: true
        - obj:
            hidden: true
            layout:
              type: flex
            widgets:
              - label:
                  text: ""

# --- Update clock display every second, check alarms on minute change ---
interval:
  - interval: 1s
    then:
      - lambda: |-
          auto time = id(ha_time).now();
          if (!time.is_valid()) {
            time = id(sntp_time).now();
          }
          if (time.is_valid()) {
            // ESPTime::day_of_week is 1-based (1=Sun..7=Sat); convert to
            // 0-based (0=Sun..6=Sat) used by alarm_time.h.
            uint8_t dow = static_cast<uint8_t>(time.day_of_week - 1);
            // Only redraw clock/date when values actually change to reduce
            // LVGL workload and visible tearing on the RGB panel.
            static int last_hour = -1;
            static int last_minute = -1;
            static int last_month = -1;
            static int last_day = -1;
            static int last_dow = -1;

            if (time.hour != last_hour || time.minute != last_minute) {
              alarmclock::ui_update_clock(time.hour, time.minute,
                                         id(alarm_clock_component).time_format_24h());
              last_hour = time.hour;
              last_minute = time.minute;
            }

            if (time.month != last_month ||
                time.day_of_month != last_day ||
                static_cast<int>(dow) != last_dow) {
              alarmclock::ui_update_date(time.month, time.day_of_month, dow);
              last_month = time.month;
              last_day = time.day_of_month;
              last_dow = dow;
            }
            // Check alarms on every tick — the C++ side deduplicates per minute.
            id(alarm_clock_component).check_alarms_(
                time.hour, time.minute, dow);
          }

# --- Alarm clock custom component (I2C backlight controller + alarm logic) ---
alarmclock:
  id: alarm_clock_component
  address: ${controller_address}
  backlight_mode: ${backlight_mode}
  speaker_amp_mode: ${speaker_amp_mode}
  rtttl_id: alarm_rtttl

# --- I2S audio output (MAX98357A) ---
i2s_audio:
  i2s_lrclk_pin: ${i2s_lrclk_pin}
  i2s_bclk_pin: ${i2s_bclk_pin}

speaker:
  - platform: i2s_audio
    id: alarm_speaker
    dac_type: external
    i2s_dout_pin: ${i2s_dout_pin}
    channel: mono
    timeout: never
    sample_rate: 16000
    use_apll: true

# --- RTTTL tone generator (for alarm sound) ---
rtttl:
  speaker: alarm_speaker
  id: alarm_rtttl
  gain: 50%
  on_finished_playback:
    - lambda: 'id(alarm_clock_component).on_rtttl_finished();'

# --- Light sensor ---
# BH1750 I²C light sensor. Feeds brightness data to the alarm clock component.
sensor:
  - platform: bh1750
    name: "Ambient Light"
    id: ambient_light
    address: 0x23
    update_interval: 5s
    on_value:
      then:
        - lambda: |-
            // Logarithmic interpolation from a dark bedroom to indirect
            // daylight; brighter conditions use the configured daytime level.
            float sf = alarmclock::lux_to_sensor_factor(
                x, alarmclock::kAmbientDarkLux, alarmclock::kAmbientDayLux);
            id(alarm_clock_component).set_sensor_factor(sf, x);

# ---------------------------------------------------------------------------
# Home Assistant control entities.
# These let you control the alarm from HA automations, dashboards, or
# external buttons (e.g., bedside button to dismiss alarm + trigger scenes).
# ---------------------------------------------------------------------------

# --- Buttons: Dismiss / Snooze from HA ---
button:
  - platform: template
    name: "Dismiss Alarm"
    id: btn_dismiss
    icon: "mdi:alarm-off"
    on_press:
      - lambda: 'id(alarm_clock_component).dismiss_alarm();'

  - platform: template
    name: "Snooze Alarm"
    id: btn_snooze
    icon: "mdi:alarm-snooze"
    on_press:
      - lambda: 'id(alarm_clock_component).snooze_alarm();'

# --- Number: Volume / Brightness from HA ---
number:
  - platform: template
    name: "Alarm Volume"
    id: num_volume
    icon: "mdi:volume-high"
    min_value: 0
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    lambda: |-
      return id(alarm_clock_component).volume() * 100.0f;
    update_interval: 5s
    set_action:
      - lambda: 'id(alarm_clock_component).set_volume(x / 100.0f);'

  - platform: template
    name: "Display Brightness"
    id: num_brightness
    icon: "mdi:brightness-6"
    min_value: 0
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    lambda: |-
      return id(alarm_clock_component).brightness() * 100.0f;
    update_interval: 5s
    set_action:
      - lambda: 'id(alarm_clock_component).set_brightness(x / 100.0f);'

  - platform: template
    name: "Night Brightness"
    id: num_night_brightness
    icon: "mdi:brightness-4"
    min_value: 0
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    lambda: |-
      return id(alarm_clock_component).night_brightness_fraction() * 100.0f;
    update_interval: 5s
    set_action:
      - lambda: |-
          id(alarm_clock_component).set_night_brightness_fraction(x / 100.0f);

  - platform: template
    name: "Raw Backlight PWM"
    id: num_raw_backlight_pwm
    icon: "mdi:pulse"
    min_value: 0
    max_value: ${raw_backlight_pwm_max}
    step: 1
    lambda: |-
      return id(alarm_clock_component).raw_backlight_pwm();
    update_interval: 1s
    set_action:
      - lambda: |-
          id(alarm_clock_component).set_raw_backlight_pwm(
              static_cast<uint8_t>(x));

switch:
  - platform: template
    name: "Raw Backlight PWM Override"
    id: switch_raw_backlight_override
    icon: "mdi:tune-variant"
    restore_mode: ALWAYS_OFF
    lambda: |-
      return id(alarm_clock_component).raw_backlight_override();
    turn_on_action:
      - lambda: 'id(alarm_clock_component).set_raw_backlight_override(true);'
    turn_off_action:
      - lambda: 'id(alarm_clock_component).set_raw_backlight_override(false);'

# --- Text Sensor: Alarm state (idle/firing/snoozed) ---
text_sensor:
  - platform: template
    name: "Alarm State"
    id: alarm_state_sensor
    icon: "mdi:alarm"
    update_interval: 1s
    lambda: |-
      auto state = id(alarm_clock_component).alarm_state();
      switch (state) {
        case alarmclock::AlarmState::kFiring:
          return std::string("firing");
        case alarmclock::AlarmState::kSnoozed:
          return std::string("snoozed");
        default:
          return std::string("idle");
      }

# --- Binary Sensor: Is alarm currently firing? ---
binary_sensor:
  - platform: template
    name: "Alarm Firing"
    id: alarm_firing_sensor
    icon: "mdi:alarm-light"
    lambda: 'return id(alarm_clock_component).is_firing();'
